name: Build and Release APK (Release Mode)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "ZIP tidak ditemukan!"; exit 1; fi
          mkdir -p ./temp_project
          unzip -q "$ZIP" -d ./temp_project
          find ./temp_project -maxdepth 3 -name "*.zip" -exec unzip -q -o {} -d ./temp_project \;
          PROJ_DIR=$(find ./temp_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then PROJ_DIR="./temp_project"; fi
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias alfykey -keyalg RSA -keysize 2048 -validity 10000 -storepass alfy123 -keypass alfy123 -dname "CN=Alfy, OU=Dev, O=Alfy, L=City, S=State, C=ID"

      - name: Build APK (Release)
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
          gradle assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore -Pandroid.injected.signing.store.password=alfy123 -Pandroid.injected.signing.key.alias=alfykey -Pandroid.injected.signing.key.password=alfy123

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find ${{ env.PROJ_DIR }} -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK Release gagal dibuat."; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "AlfyBuild Release ${{ github.run_number }}"
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
